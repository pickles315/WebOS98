<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#008080">
<title>WebOS 98</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="desktop" aria-label="WebOS 98 desktop">
  <div class="desktop-icons">
    <button class="desktop-icon" data-open="computer"><span class="icon-art">🖥️</span><span>My Computer</span></button>
    <button class="desktop-icon" data-open="files"><span class="icon-art">📁</span><span>My Documents</span></button>
    <button class="desktop-icon" data-open="browser"><span class="icon-art">🌐</span><span>Internet Explorer</span></button>
    <button class="desktop-icon" data-open="notepad"><span class="icon-art">📝</span><span>Notepad</span></button>
    <button class="desktop-icon" data-open="terminal"><span class="icon-art">▣</span><span>MS-DOS Prompt</span></button>
    <button class="desktop-icon" data-open="minesweeper"><span class="icon-art">💣</span><span>Minesweeper</span></button>
  </div>
  <div id="windows"></div>
  <div id="start-menu" class="start-menu hidden">
    <div class="start-banner"><b>WebOS</b><span>98</span></div>
    <div class="start-items">
      <button data-open="computer">🖥️ My Computer</button><button data-open="files">📁 My Documents</button>
      <button data-open="browser">🌐 Internet Explorer</button><button data-open="notepad">📝 Notepad</button>
      <button data-open="terminal">▣ MS-DOS Prompt</button><button data-open="minesweeper">💣 Minesweeper</button>
      <button data-open="settings">⚙️ Settings</button>
      <hr><button id="about-button">ℹ️ About WebOS 98</button>
    </div>
  </div>
  <div id="context-menu" class="context-menu hidden">
    <button data-context="refresh">Refresh</button><button data-open="notepad">New text document</button><button data-open="settings">Properties</button>
  </div>
  <footer class="taskbar">
    <button id="start-button" class="start-button"><span class="start-mark">▦</span> Start</button>
    <div id="task-buttons"></div><div class="tray"><span>🔊</span><span id="clock">12:00 PM</span></div>
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
